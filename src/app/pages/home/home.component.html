<div class="top-actions">
  <button class="btn-download" (click)="goToPage()">
    <img src="assets/phone.png" alt="Télécharger l'aplication mobile" class="icon-smartphone" />
    <span class="tooltip">Télécharger l'application mobile</span>
  </button>
</div>

<div class="section">
  <h2>Nouveautés</h2>
  <div *ngIf="nouveautes.length === 0">
    <p>Aucune nouveauté cette semaine !</p>
  </div>
  <div class="film-grid">
    <div class="film-card" *ngFor="let film of nouveautes">
      <a>
        <img [src]="film.image" [alt]="film.titre" />
      </a>
      <p>{{ film.titre }}</p>
    </div>
  </div>
</div>

<div class="section">
  <h2>Films à l'affiche</h2>
  <div class="film-grid">
    <div class="film-card" *ngFor="let film of affiches">
      <a>
        <img [src]="film.image" [alt]="film.titre" />
      </a>
      <p>{{ film.titre }}</p>
    </div>
  </div>
</div>
